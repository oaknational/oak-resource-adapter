packages:
  - apps/*
  - packages/*

engineStrict: true

# 7 days, in minutes; must match the Dependabot cooldown exactly.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@oaknational/*"

autoInstallPeers: false

allowBuilds:
  esbuild: true
  sharp: true
  "@swc/core": false
  cbor-extract: false
  core-js: false
  protobufjs: false
