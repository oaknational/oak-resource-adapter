version: 2
updates:
  - package-ecosystem: npm
    # .npmrc sets shared-workspace-lockfile=true, so there is one root
    # lockfile; per-package entries would conflict over it.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      exclude:
        - "@oaknational/*"
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node tracks the Node major in package.json engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tracks OWA's major; v8 needs React 19 and OWA is on React 18.
      - dependency-name: "@portabletext/react"
        update-types: ["version-update:semver-major"]
    groups:
      # Majors arrive as separate PRs, which splits two pairs that must move
      # together: vitest with @vitest/*, and @google-cloud/cloud-sql-connector
      # with google-auth-library. Push the partner's bump onto one PR and close
      # the other.
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
