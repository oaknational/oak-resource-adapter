name: Deploy preview

# Deploys the API and the harness as a pair and tests the result. Only this
# workflow knows both URLs, which is why the Git integration cannot do it.
# See docs/DEPLOYMENT.md.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-preview-${{ github.ref }}
  # Cancel superseded pull request runs, including mid-migration: the whole
  # pending batch runs in one transaction, so a dropped connection rolls it back
  # and releases the advisory lock, and the next push reapplies it.
  #
  # A push to main is never cancelled. Cancelling the caller cancels the
  # migration with it whatever the called job's own concurrency says, and
  # staging is what everything else is tested against.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every Preview migrates the shared staging database before deploying, so a
  # schema change is testable in its own Preview. docs/DATABASE.md has the rules
  # that keeps safe.
  #
  # Fork and Dependabot pull requests hold no repository secrets, so both jobs
  # skip. Skipped rather than guarded step by step, unlike ci.yml's browser
  # tests, because neither should ever be a required check.
  migrate:
    name: Database
    if: >-
      vars.ENABLE_VERCEL_DEPLOYMENTS == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # A called workflow cannot grant itself more than its caller holds, so
    # db-migrate.yml's own id-token: write is not enough on its own.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/db-migrate.yml
    with:
      environment: staging
    secrets: inherit

  deploy:
    name: Deploy and test
    # `needs` alone is the gate on the migration: a failed or skipped migrate
    # job stops this one, which is why there is no always() here.
    needs: migrate
    # Repeated from migrate rather than inherited, so the reason this does not
    # run for a fork or Dependabot stays legible here.
    if: >-
      vars.ENABLE_VERCEL_DEPLOYMENTS == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # comment the deployment URLs
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # main gets the staging custom environment and its stable domains;
      # everything else gets an ordinary Preview.
      VERCEL_TARGET: ${{ github.ref == 'refs/heads/main' && 'staging' || 'preview' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Brings the Vercel CLI with it, pinned by the root package.json.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API first: the harness deployment below needs its URL. Vercel builds
      # remotely from the project's own environment variables, which Terraform
      # owns, so nothing here reconstructs configuration.
      - name: Deploy the API
        id: api
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: |
          url="$(pnpm exec vercel deploy --yes --target="$VERCEL_TARGET" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed the API to $url"

      # RESOURCE_ADAPTER_API_BYPASS_SECRET is the API project's secret, not this
      # project's: see app/adapter-proxy/[...path]/route.ts.
      - name: Deploy the harness
        id: harness
        env:
          API_BYPASS_SECRET: ${{ secrets.VERCEL_API_BYPASS_SECRET }}
          API_URL: ${{ steps.api.outputs.url }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_HARNESS }}
        run: |
          url="$(pnpm exec vercel deploy --yes --target="$VERCEL_TARGET" --token="$VERCEL_TOKEN" \
            --env "RESOURCE_ADAPTER_API_ORIGIN=$API_URL" \
            --env "RESOURCE_ADAPTER_API_BYPASS_SECRET=$API_BYPASS_SECRET")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed the harness to $url"

      # Before the tests, so the URLs are on the pull request even when the
      # suite goes on to fail.
      - name: Comment the deployment URLs
        if: github.event_name == 'pull_request'
        env:
          API_URL: ${{ steps.api.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARNESS_URL: ${{ steps.harness.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$(cat <<EOF
          | Deployment | URL |
          | ---------- | ------------- |
          | Harness    | $HARNESS_URL |
          | API        | $API_URL |

          Both sit behind Vercel Authentication. Open the harness, not the API: the
          harness reaches the API through its own \`/adapter-proxy\` route.
          EOF
          )"

          # Edits its own previous comment, so a busy branch leaves one.
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$body"

      # Proves the pair, not just the deployment: this path only answers if the
      # harness resolved its API origin and its bypass secret opened the API.
      - name: Confirm the harness reaches its API
        env:
          BYPASS_SECRET: ${{ secrets.VERCEL_HARNESS_BYPASS_SECRET }}
          HARNESS_URL: ${{ steps.harness.outputs.url }}
        run: |
          body=""
          for attempt in 1 2 3 4 5; do
            if body="$(curl -fsS --max-time 30 \
              -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
              "$HARNESS_URL/adapter-proxy/health")"; then
              break
            fi

            body=""
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 5 ]; then
              sleep 10
            fi
          done

          echo "$body"
          if [ "$(printf '%s' "$body" | jq -r '.status // empty')" != "ok" ]; then
            echo "::error::The harness could not reach its paired API at $HARNESS_URL/adapter-proxy/health."
            exit 1
          fi

      - name: Confirm the paired API is ready
        env:
          BYPASS_SECRET: ${{ secrets.VERCEL_HARNESS_BYPASS_SECRET }}
          HARNESS_URL: ${{ steps.harness.outputs.url }}
        run: node scripts/check-deployment-readiness.mjs "$HARNESS_URL/adapter-proxy/health/ready"

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium
          restore-keys: playwright-${{ runner.os }}-

      # Run this even on a cache hit: it takes about a second and re-downloads
      # the browser after a Playwright bump. The runner image already has the
      # system libraries, and headless tests only need the headless shell.
      - name: Install Playwright browser
        id: playwright_install
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm exec playwright install --only-shell chromium

      # A separate step so the retry still runs if the first attempt times out.
      - name: Retry Playwright browser install
        if: steps.playwright_install.outcome == 'failure'
        timeout-minutes: 5
        run: pnpm exec playwright install --only-shell chromium

      # The Clerk values must be the instance the deployed harness verifies
      # against, or the suite dies at sign-in.
      #
      # This bypass secret is the harness's own, unlike the one handed to the
      # deploy step above: the browser has to get past the harness's own wall.
      #
      # Staging runs against its durable domain, not the deployment URL. The API
      # derives Clerk's authorized parties from the forwarded origin, and
      # env_vars.api_staging lists that domain exactly rather than carrying the
      # Preview wildcard, so a deployment URL is rejected and every signed-in
      # test reads as signed out. Hardcoded because the domain is meant never to
      # change; it is also RESOURCE_ADAPTER_ALLOWED_ORIGINS in the workspace.
      - name: Run the deployment-safe browser tests
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://resource-adapter-harness-staging.thenational.academy' || steps.harness.outputs.url }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_HARNESS_BYPASS_SECRET }}
        run: pnpm test:e2e:deployment

      # Traces and screenshots live only on the runner, so a failure is
      # undiagnosable unless they leave with it.
      - name: Upload browser test evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-evidence-deployment
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
