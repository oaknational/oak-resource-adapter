name: Apply database migrations

# Applies pending migrations before the API deployment that depends on them.
#
# Each GitHub Environment holds one secret: a read-only DOPPLER_TOKEN scoped to
# that environment's Doppler config. The connection string is fetched at run time,
# so there is no second copy of it to rotate.
#
# Database access is confined to the "Apply migrations" step. CI's egress IP
# cannot be allowlisted on the databases, so that step is expected to be replaced
# — by an in-network runner, an identity-authenticated proxy, or a triggered
# in-network job — and confining it keeps that a one-step change.

on:
  # No outputs: a caller gates its promotion on this job's conclusion.
  workflow_call:
    inputs:
      environment:
        description: The GitHub Environment to migrate.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: The GitHub Environment to migrate.
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# The advisory lock in the migrate script is the backstop; this avoids it.
concurrency:
  group: db-migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # No version input: the action reads it from the root packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject Doppler env vars
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      # Names the likely cause — a token scoped to the wrong Doppler config —
      # which the migrate script could only report as a missing variable.
      - name: Confirm Doppler supplied a database URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DOPPLER_TOKEN for the ${{ inputs.environment }} environment is scoped to a Doppler config with no DATABASE_URL."
            exit 1
          fi

      - name: Apply migrations
        run: pnpm db:migrate:deploy
