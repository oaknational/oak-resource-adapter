name: Apply database migrations

# Applies pending migrations before the API deployment that depends on them.

on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub Environment to migrate.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: The GitHub Environment to migrate.
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# The advisory lock in the migrate script is the backstop; this avoids it.
concurrency:
  group: db-migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm the environment supplies a database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The ${{ inputs.environment }} environment has no DATABASE_URL secret."
            exit 1
          fi

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate:deploy
