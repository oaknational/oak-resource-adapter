name: SonarCloud

on:
  push:
    # Keep in step with ci.yml.
    branches: [main, production]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resource_adapter
      # Include the database integration suite so its coverage reaches SonarCloud.
      RUN_DATABASE_INTEGRATION_TESTS: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: resource_adapter
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resource_adapter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No version input: the action reads it from the root packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @oaknational/resource-adapter-db db:migrate:deploy

      - run: pnpm test:coverage

      - name: Scan code and coverage
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # The issue query below only sees this analysis once it has been processed.
          args: -Dsonar.qualitygate.wait=true

      # The quality gate tolerates minor code smells; this fails on any open issue.
      - name: Fail on open Sonar issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        # A lookup that fails must fail the step: an unread count is not zero.
        run: |
          set -euo pipefail
          project=oaknational_oak-resource-adapter
          if [ -n "$PULL_REQUEST" ]; then scope="pullRequest=$PULL_REQUEST"; else scope="branch=$BRANCH"; fi
          if ! response="$(curl --fail-with-body -sS -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarcloud.io/api/issues/search?organization=oaknational&componentKeys=$project&resolved=false&ps=1&$scope")"; then
            echo "::error::Sonar issue search failed: $response"
            exit 1
          fi
          if ! total="$(jq -er '.paging.total | numbers' <<<"$response")"; then
            echo "::error::Sonar issue search returned no issue count: $response"
            exit 1
          fi
          if [ "$total" -ne 0 ]; then
            echo "::error::$total open Sonar issue(s): https://sonarcloud.io/project/issues?id=$project&$scope&resolved=false"
            exit 1
          fi
