name: Release

on:
  # Incomplete scaffold; see docs/DEVELOPMENT.md before enabling releases.
  # GitHub reads this trigger from the default branch.
  workflow_run:
    workflows: [CI]
    # Not main: main runs ahead of production, and OWA pins whatever is
    # published, so a package must only carry code production has.
    branches: [production]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Opt in explicitly: Changesets can publish with no pending changesets.
    # Require a push to this repository; the branch filter alone allows fork PRs.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.ENABLE_NPM_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the version commit, tags, and GitHub releases
      pull-requests: write # open and update the version packages PR
      id-token: write # npm OIDC trusted publishing

    steps:
      # Require the CI commit to equal or be an ancestor of production before checkout.
      - name: Verify the commit is on production
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          compare_status="$(gh api "repos/$REPO/compare/production...$SHA" --jq .status)"
          case "$compare_status" in
            identical | behind) ;;
            *)
              echo "::error::$SHA is not on production (compare status: $compare_status)."
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the verified CI commit; workflow_run defaults to the default branch.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Read the pnpm version from the root packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # pnpm publish uses npm; trusted publishing requires npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm audit does not verify signatures; use npm.
      - name: Verify dependency signatures and attestations
        run: npm audit signatures

      - name: Create release pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Override workflow_run's default-branch ref for the version PR.
          branch: production
          version: pnpm ci:version
          publish: pnpm ci:publish
          commit: "chore: version packages"
          title: "chore: version packages"
          # Use the GitHub API for version commits without persisting git credentials.
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          HUSKY: "0"
