name: CI

on:
  pull_request:
  push:
    # `production` is not created yet. release.yml publishes only after CI passes
    # there, so it has to be listed here.
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs. Push runs on main and production must
  # complete because downstream workflows can depend on their conclusion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changeset:
    name: Check package release metadata
    # The Changesets action's own version pull request consumes the changesets
    # it is versioning, so this check would always fail against it. Dependabot
    # cannot write changesets, so it would always fail against those too.
    if: >-
      github.event_name == 'pull_request' &&
      vars.ENFORCE_CHANGESETS == 'true' &&
      github.head_ref != 'changeset-release/production' &&
      !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changeset status
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        run: |
          version=8.30.0
          asset="gitleaks_${version}_linux_x64.tar.gz"
          expected=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          curl -sSfL -o "$asset" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          echo "${expected}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          ./gitleaks detect --redact=100 --source . --log-opts="--branches --tags"

  static-checks:
    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Check dependency boundaries
        run: pnpm deps:check

      - name: Check migration history
        run: pnpm db:check

      - name: Check the schema and its migrations agree
        run: |
          pnpm db:generate
          # Include untracked generated migrations as well as edited files.
          drift="$(git status --porcelain -- packages/db/drizzle)"
          if [ -n "$drift" ]; then
            echo "::error::The Drizzle schema has changes with no committed migration."
            echo "Run 'pnpm db:generate' and commit the generated files."
            echo "$drift"
            exit 1
          fi

      - name: Type-check
        run: pnpm type-check

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  database-integration:
    name: Run database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resource_adapter
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: resource_adapter
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resource_adapter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @oaknational/resource-adapter-db db:migrate:deploy

      - name: Run database integration tests
        # The curriculum package's integration tests reach Oak's real curriculum
        # endpoint and downloads API. This job holds only an ephemeral Postgres, so
        # they are excluded until CI has somewhere to read those credentials from.
        run: pnpm test:integration --filter='!@oaknational/resource-adapter-curriculum'

  package-artifact:
    name: Verify published package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify published package
        run: pnpm test:artifact

  browser-tests:
    name: Run browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway database, so no pull request reads or writes the shared staging
      # one.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resource_adapter
      # The harness posts to the /dev routes, which fail closed without this.
      ENABLE_DEV_ROUTES: "1"
      # The three values e2e/global.setup.ts asserts. `secrets` cannot be read
      # from an `if:` condition; `env` can.
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: resource_adapter
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resource_adapter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs even when the suite below is skipped, so a dependency bump that
      # breaks the migrations is still caught.
      - name: Apply database migrations
        run: pnpm --filter @oaknational/resource-adapter-db db:migrate:deploy

      - name: Cache the Playwright browser
        if: env.CLERK_SECRET_KEY != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium
          restore-keys: playwright-${{ runner.os }}-

      # Install still runs on a cache hit: it is a ~1s no-op then, and after a
      # Playwright bump it re-downloads what the restored cache lacks. The
      # runner image already carries Chromium's shared libraries (no
      # --with-deps), and the suite is headless throughout (--only-shell).
      - name: Install Playwright browser
        id: playwright_install
        if: env.CLERK_SECRET_KEY != ''
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm exec playwright install --only-shell chromium

      # A separate step gives the retry its own timeout when GitHub terminates
      # the first attempt rather than letting the command exit by itself.
      - name: Retry Playwright browser install
        if: >-
          env.CLERK_SECRET_KEY != '' &&
          steps.playwright_install.outcome == 'failure'
        timeout-minutes: 5
        run: pnpm exec playwright install --only-shell chromium

      # Fork pull requests carry no repository secrets, so they have no Clerk
      # credentials to sign in with; Dependabot pull requests read the Dependabot
      # secret store, which holds them. Guarded per step, not per job:
      # `Run browser tests` is a required check, and a skipped job blocks a merge
      # just as a failed one does.
      - name: Run browser tests
        if: env.CLERK_SECRET_KEY != ''
        run: pnpm test:e2e

      # Traces and screenshots live only on the runner, so a failure is
      # undiagnosable unless they leave with it.
      - name: Upload browser test evidence
        if: failure() && env.CLERK_SECRET_KEY != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Report a skipped suite
        if: env.CLERK_SECRET_KEY == ''
        run: |
          echo "::warning::Browser tests skipped: this event carries no repository secrets, so there are no Clerk credentials to sign in with. Expected for fork pull requests."
