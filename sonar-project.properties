sonar.projectKey=oaknational_oak-resource-adapter
sonar.organization=oaknational
sonar.projectName=oak-resource-adapter

sonar.sources=apps,packages
sonar.exclusions=**/dist/**,**/generated/**,**/.next/**,**/coverage/**,**/*.d.ts
# Analysed for code smells, but not required to carry test coverage: the demo
# harness UI, dev-only routes, build/tool config, and DB bootstrapping.
sonar.coverage.exclusions=apps/harness/**,apps/api/app/dev/**,packages/db/src/client.ts,**/*.config.ts,**/*.config.mjs,**/instrumentation.ts,**/vitest.setup.ts
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/sentry.*.config.ts
sonar.javascript.lcov.reportPaths=apps/**/coverage/lcov.info,packages/**/coverage/lcov.info
